<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ─── EDIT: page title shown in the browser tab ─── -->
<title>Games I made</title>
<meta name="description" content="Games you can play in your browser.">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    /* page */
    --paper:      #efedf4;
    --paper-lift: #f8f7fb;
    --ink:        #241f33;
    --ink-soft:   #635c75;
    --rule:       #d8d3e2;

    /* the six game colours — reuse these when you add a game */
    --poppy:     #d8452f;
    --marigold:  #c97a10;
    --jade:      #1f8368;
    --cobalt:    #2a63bd;
    --violet:    #7b45b8;
    --raspberry: #c02f74;

    /* every row falls back to this if no colour is set */
    --c: var(--cobalt);

    --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    overflow-x: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--display);
    font-size: 17px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  /* the six colours lined up across the top, like a row of cartridges */
  .strip {
    height: 7px;
    background: linear-gradient(
      to right,
      var(--poppy)     0 16.66%,
      var(--marigold)  16.66% 33.33%,
      var(--jade)      33.33% 50%,
      var(--cobalt)    50% 66.66%,
      var(--violet)    66.66% 83.33%,
      var(--raspberry) 83.33% 100%
    );
  }

  .page {
    position: relative;
    max-width: 46rem;
    margin: 0 auto;
    padding: clamp(2.5rem, 10vh, 6rem) clamp(1.25rem, 5vw, 2.5rem) 4rem;
  }

  /* ── Masthead ───────────────────────────────── */

  .eyebrow {
    margin: 0 0 1.5rem;
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--raspberry);
  }

  .title {
    margin: 0;
    font-size: clamp(2.4rem, 8vw, 3.6rem);
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1.02;
  }

  .lede {
    margin: 1.1rem 0 0;
    max-width: 34rem;
    color: var(--ink-soft);
    font-size: 1.0625rem;
  }

  /* ── Game list ──────────────────────────────── */

  .stack {
    list-style: none;
    margin: clamp(3rem, 8vh, 4.5rem) 0 0;
    padding: 0;
    border-top: 1px solid var(--rule);
  }

  .stack > li + li { border-top: 1px solid var(--rule); }

  .entry {
    display: block;
    position: relative;
    padding: 1.6rem 1rem;
    margin-left: -1rem;
    margin-right: -1rem;
    border-radius: 10px;
    text-decoration: none;
    transition: background-color 160ms ease;
  }

  .entry:hover,
  .entry:focus-visible { background: color-mix(in srgb, var(--c) 9%, var(--paper-lift)); }

  .entry:focus-visible {
    outline: 2px solid var(--c);
    outline-offset: 2px;
  }

  .entry__head {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
  }

  /* each game carries its own colour, like a label on a cartridge */
  .chip {
    flex: none;
    width: 0.7rem;
    height: 0.7rem;
    border-radius: 3px;
    background: var(--c);
    transform: rotate(0deg);
    transition: transform 220ms cubic-bezier(0.2, 0.7, 0.3, 1);
  }

  .entry:hover .chip,
  .entry:focus-visible .chip { transform: rotate(45deg); }

  .entry__title {
    margin: 0;
    color: var(--c);
    font-size: clamp(1.3rem, 3.4vw, 1.7rem);
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .entry__arrow {
    font-family: var(--mono);
    color: var(--c);
    transform: translateX(-0.25rem);
    opacity: 0;
    transition: transform 200ms ease, opacity 160ms ease;
  }

  .entry:hover .entry__arrow,
  .entry:focus-visible .entry__arrow {
    transform: translateX(0);
    opacity: 1;
  }

  .entry__desc {
    margin: 0.35rem 0 0.7rem 1.3rem;
    max-width: 36rem;
    color: var(--ink-soft);
    font-size: 0.9375rem;
  }

  /* the real address, treated as content rather than decoration */
  .entry__meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem 0.7rem;
    margin: 0 0 0 1.3rem;
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
  }

  .entry__url {
    color: var(--ink);
    border-bottom: 1px solid transparent;
    transition: border-color 160ms ease;
  }

  .entry:hover .entry__url,
  .entry:focus-visible .entry__url { border-bottom-color: var(--c); }

  .sep { color: var(--rule); }

  /* ── Footer ─────────────────────────────────── */

  .foot {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.5rem;
    margin-top: clamp(3rem, 8vh, 4.5rem);
    padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
  }

  .foot a {
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 1px;
  }

  .foot a:hover,
  .foot a:focus-visible { color: var(--jade); border-bottom-color: var(--jade); }


  /* ── Pixel critters ─────────────────────────── */

  /* Pinned to the browser window rather than to the content, so adding
     or removing games never shifts them. --gutter measures from the
     middle of the window out to the empty margin beside the text. */
  .px {
    position: fixed;
    --gutter: calc(50% - 26.5rem);
    width: 3rem;
    height: auto;
    color: var(--c, var(--cobalt));
    pointer-events: none;
    transform-origin: 50% 100%;
  }

  .px--robot   { --c: var(--cobalt);   top: 5rem;     right: var(--gutter); width: 3.4rem;
                 animation: clank 2.4s steps(8, end) infinite; }
  .px--frog    { --c: var(--jade);     top: 15rem;    left:  var(--gutter);
                 animation: hop 3.4s ease-in-out 0.6s infinite; }
  .px--gem     { --c: var(--marigold); bottom: 13rem; right: var(--gutter); width: 2.4rem;
                 animation: spin 7s linear infinite; }
  .px--critter { --c: var(--violet);   bottom: 5rem;  left:  var(--gutter);
                 animation: waddle 2.6s ease-in-out 1.2s infinite; }

  /* Each critter moves the way its own thing would move. */
  @keyframes clank {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25%      { transform: translateY(-0.35rem) rotate(-5deg); }
    50%      { transform: translateY(0) rotate(0deg); }
    75%      { transform: translateY(-0.2rem) rotate(5deg); }
  }

  @keyframes hop {
    0%, 60%, 100% { transform: translateY(0) scale(1, 1); }
    66%           { transform: translateY(0) scale(1.12, 0.8); }
    75%           { transform: translateY(-1.2rem) scale(0.92, 1.12); }
    86%           { transform: translateY(0) scale(1.1, 0.86); }
    93%           { transform: translateY(0) scale(1, 1); }
  }

  @keyframes spin {
    0%   { transform: rotate(0deg) scale(1); }
    50%  { transform: rotate(180deg) scale(1.2); }
    100% { transform: rotate(360deg) scale(1); }
  }

  @keyframes waddle {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    25%      { transform: translate(-0.35rem, -0.15rem) rotate(-9deg); }
    50%      { transform: translate(0, -0.3rem) rotate(0deg); }
    75%      { transform: translate(0.35rem, -0.15rem) rotate(9deg); }
  }

  /* they live in the outer margins, so they only appear when there's room */
  @media (max-width: 1100px) {
    .px { display: none; }
  }

  /* ── Load sequence ──────────────────────────── */

  .rise {
    animation: rise 500ms cubic-bezier(0.2, 0.7, 0.3, 1) backwards;
  }

  .rise:nth-child(1) { animation-delay: 40ms; }
  .rise:nth-child(2) { animation-delay: 100ms; }
  .rise:nth-child(3) { animation-delay: 160ms; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(0.5rem); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition-duration: 1ms !important;
    }
  }
</style>
</head>

<body>

<!-- ─── Pixel critters. Original artwork, drawn as squares on a grid.
     Each one takes its colour from the --c value set on the <use> tag.
     The blinking lives in here because it happens inside the drawings.
─────────────────────────────────────────────────────────────────── -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <style>
    .blink-a { animation: blink 4.7s infinite; }
    .blink-b { animation: blink 6.1s infinite; }
    .blink-c { animation: blink 5.3s infinite; }
    @keyframes blink {
      0%, 93%, 97%, 100% { opacity: 1; }
      94%, 96%           { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .blink-a, .blink-b, .blink-c { animation: none; }
    }
  </style>
  <defs>

    <symbol id="px-robot" viewBox="0 0 10 10">
      <g fill="currentColor" shape-rendering="crispEdges">
        <rect x="4" y="0" width="1" height="2"/>
        <rect x="2" y="2" width="6" height="3"/>
        <rect x="3" y="5" width="4" height="1"/>
        <rect x="1" y="6" width="8" height="3"/>
        <rect x="0" y="6" width="1" height="2"/>
        <rect x="9" y="6" width="1" height="2"/>
        <rect x="2" y="9" width="2" height="1"/>
        <rect x="6" y="9" width="2" height="1"/>
      </g>
      <g class="blink-a" fill="#efedf4" shape-rendering="crispEdges">
        <rect x="3" y="3" width="1" height="1"/>
        <rect x="6" y="3" width="1" height="1"/>
      </g>
      <rect x="3" y="7" width="4" height="1" fill="#efedf4" shape-rendering="crispEdges"/>
    </symbol>

    <symbol id="px-frog" viewBox="0 0 10 8">
      <g fill="currentColor" shape-rendering="crispEdges">
        <rect x="1" y="0" width="2" height="2"/>
        <rect x="7" y="0" width="2" height="2"/>
        <rect x="1" y="2" width="8" height="4"/>
        <rect x="0" y="6" width="3" height="1"/>
        <rect x="7" y="6" width="3" height="1"/>
        <rect x="2" y="6" width="6" height="1"/>
      </g>
      <g class="blink-b" fill="#efedf4" shape-rendering="crispEdges">
        <rect x="1" y="0" width="1" height="1"/>
        <rect x="8" y="0" width="1" height="1"/>
      </g>
      <rect x="3" y="4" width="4" height="1" fill="#efedf4" shape-rendering="crispEdges"/>
    </symbol>

    <symbol id="px-gem" viewBox="0 0 10 8">
      <g fill="currentColor" shape-rendering="crispEdges">
        <rect x="4" y="0" width="2" height="1"/>
        <rect x="3" y="1" width="4" height="1"/>
        <rect x="2" y="2" width="6" height="1"/>
        <rect x="1" y="3" width="8" height="2"/>
        <rect x="2" y="5" width="6" height="1"/>
        <rect x="3" y="6" width="4" height="1"/>
        <rect x="4" y="7" width="2" height="1"/>
      </g>
      <rect class="blink-c" x="3" y="2" width="1" height="1" fill="#efedf4" shape-rendering="crispEdges"/>
    </symbol>

    <symbol id="px-critter" viewBox="0 0 10 8">
      <g fill="currentColor" shape-rendering="crispEdges">
        <rect x="1" y="0" width="1" height="1"/>
        <rect x="8" y="0" width="1" height="1"/>
        <rect x="2" y="1" width="6" height="1"/>
        <rect x="1" y="2" width="8" height="4"/>
        <rect x="1" y="6" width="2" height="1"/>
        <rect x="7" y="6" width="2" height="1"/>
      </g>
      <g class="blink-c" fill="#efedf4" shape-rendering="crispEdges">
        <rect x="3" y="3" width="1" height="1"/>
        <rect x="6" y="3" width="1" height="1"/>
      </g>
    </symbol>

  </defs>
</svg>

<div class="strip"></div>

<div class="page">

  <!-- decoration only, so hidden from screen readers -->
  <svg class="px px--robot" aria-hidden="true"><use href="#px-robot"/></svg>
  <svg class="px px--frog" aria-hidden="true"><use href="#px-frog"/></svg>
  <svg class="px px--gem" aria-hidden="true"><use href="#px-gem"/></svg>
  <svg class="px px--critter" aria-hidden="true"><use href="#px-critter"/></svg>


  <!-- ─── EDIT: the heading and the introduction ─── -->
  <header>
    <p class="eyebrow rise">Made by me</p>
    <h1 class="title rise">Games I made</h1>
    <p class="lede rise">I make cool games and put them here so you can play them. Enjoy!</p>
  </header>

  <main>

    <!-- ─── To add a game, copy one <li> block and change
         the colour, the address, the name and the description.
         Colours to choose from: --poppy, --marigold, --jade,
         --cobalt, --violet, --raspberry
    ─────────────────────────────────────────────────── -->
    <ul class="stack">

      <li style="--c: var(--poppy)">
        <a class="entry" href="https://games.marchant.info/spaceship-sensation.html" target="_blank" rel="noopener">
          <span class="entry__head">
            <span class="chip" aria-hidden="true"></span>
            <h2 class="entry__title">Spaceship Sensation</h2>
            <span class="entry__arrow" aria-hidden="true">&rarr;</span>
          </span>
          <p class="entry__desc">Use your spaceship-flying skills to blast the enemy!</p>
          <p class="entry__meta">
            <span class="entry__url">https://games.marchant.info/spaceship-sensation.html</span>
            <span class="sep" aria-hidden="true">/</span>
            <span>2026</span>
          </p>
        </a>
      </li>

        <a class="entry" href="https://example.com" target="_blank" rel="noopener">

            <span class="chip" aria-hidden="true"></span>

          </span>
          <p class="entry__desc">Tell the robot how to make a cake, one step at a time. If you get the order wrong it makes soup instead.</p>
          <p class="entry__meta">
            <span class="entry__url">robotbakery.net</span>
            <span class="sep" aria-hidden="true">/</span>

          </p>
        </a>
      </li>
      -->

    </ul>

  </main>

</div>

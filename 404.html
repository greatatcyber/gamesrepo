<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>This page isn't here</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --paper:      #efedf4;
    --paper-lift: #f8f7fb;
    --ink:        #241f33;
    --ink-soft:   #635c75;
    --rule:       #d8d3e2;

    --poppy:     #d8452f;
    --marigold:  #c97a10;
    --jade:      #1f8368;
    --cobalt:    #2a63bd;
    --violet:    #7b45b8;
    --raspberry: #c02f74;

    --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--display);
    font-size: 17px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  .strip {
    flex: none;
    height: 7px;
    background: linear-gradient(
      to right,
      var(--poppy)     0 16.66%,
      var(--marigold)  16.66% 33.33%,
      var(--jade)      33.33% 50%,
      var(--cobalt)    50% 66.66%,
      var(--violet)    66.66% 83.33%,
      var(--raspberry) 83.33% 100%
    );
  }

  .page {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 100%;
    max-width: 46rem;
    margin: 0 auto;
    padding: clamp(2.5rem, 8vh, 5rem) clamp(1.25rem, 5vw, 2.5rem);
  }

  /* the numerals are the whole design here — one colour each,
     the middle one knocked off its axis like a fallen letter */
  .code {
    margin: 0 0 1.5rem;
    font-size: clamp(5.5rem, 24vw, 11rem);
    font-weight: 700;
    letter-spacing: -0.06em;
    line-height: 0.85;
    display: flex;
    gap: 0.02em;
  }

  .code span { display: inline-block; }

  .code span:nth-child(1) { color: var(--poppy); }
  .code span:nth-child(2) { color: var(--marigold); transform: rotate(-12deg) translateY(0.04em); }
  .code span:nth-child(3) { color: var(--cobalt); }

  .title {
    margin: 0;
    font-size: clamp(1.75rem, 5vw, 2.4rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }

  .lede {
    margin: 0.9rem 0 0;
    max-width: 32rem;
    color: var(--ink-soft);
    font-size: 1.0625rem;
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    align-self: flex-start;
    margin-top: 2.25rem;
    padding: 0.7rem 1.1rem 0.7rem 0.9rem;
    border-radius: 10px;
    background: var(--paper-lift);
    color: var(--jade);
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
    transition: background-color 160ms ease;
  }

  .back:hover,
  .back:focus-visible { background: color-mix(in srgb, var(--jade) 12%, var(--paper-lift)); }

  .back:focus-visible {
    outline: 2px solid var(--jade);
    outline-offset: 2px;
  }

  .back__arrow {
    font-family: var(--mono);
    transform: translateX(0);
    transition: transform 200ms ease;
  }

  .back:hover .back__arrow,
  .back:focus-visible .back__arrow { transform: translateX(-0.25rem); }


  /* ── Pixel critters ─────────────────────────── */

  .px {
    position: absolute;
    width: 3rem;
    height: auto;
    color: var(--c, var(--cobalt));
    pointer-events: none;
    animation: bob 4s ease-in-out infinite;
  }

  .px--robot   { --c: var(--cobalt);   top: 3rem;     right: -5rem; width: 3.4rem; animation-delay: 0s; }
  .px--critter { --c: var(--violet);   bottom: 4rem;  left: -5rem;  animation-delay: 1.2s; }
  .px--gem     { --c: var(--marigold); bottom: 12rem; right: -4rem; width: 2.4rem; animation-delay: 2.2s; }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-0.4rem); }
  }

  @media (max-width: 1100px) {
    .px { display: none; }
  }

  .rise {
    animation: rise 500ms cubic-bezier(0.2, 0.7, 0.3, 1) backwards;
  }

  .rise:nth-child(1) { animation-delay: 40ms; }
  .rise:nth-child(2) { animation-delay: 120ms; }
  .rise:nth-child(3) { animation-delay: 180ms; }
  .rise:nth-child(4) { animation-delay: 240ms; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(0.5rem); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition-duration: 1ms !important;
    }
    .code span:nth-child(2) { transform: rotate(-12deg) translateY(0.04em); }
  }
</style>
</head>

<body>

<!-- ─── Pixel critters. Original artwork, drawn as squares on a grid.
     Each one takes its colour from the --c value set on the <use> tag.
─────────────────────────────────────────────────────────────────── -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>

    <symbol id="px-robot" viewBox="0 0 10 10">
      <g fill="currentColor" shape-rendering="crispEdges">
        <rect x="4" y="0" width="1" height="2"/>
        <rect x="2" y="2" width="6" height="3"/>
        <rect x="3" y="5" width="4" height="1"/>
        <rect x="1" y="6" width="8" height="3"/>
        <rect x="0" y="6" width="1" height="2"/>
        <rect x="9" y="6" width="1" height="2"/>
        <rect x="2" y="9" width="2" height="1"/>
        <rect x="6" y="9" width="2" height="1"/>
      </g>
      <g fill="#efedf4" shape-rendering="crispEdges">
        <rect x="3" y="3" width="1" height="1"/>
        <rect x="6" y="3" width="1" height="1"/>
        <rect x="3" y="7" width="4" height="1"/>
      </g>
    </symbol>

    <symbol id="px-frog" viewBox="0 0 10 8">
      <g fill="currentColor" shape-rendering="crispEdges">
        <rect x="1" y="0" width="2" height="2"/>
        <rect x="7" y="0" width="2" height="2"/>
        <rect x="1" y="2" width="8" height="4"/>
        <rect x="0" y="6" width="3" height="1"/>
        <rect x="7" y="6" width="3" height="1"/>
        <rect x="2" y="6" width="6" height="1"/>
      </g>
      <g fill="#efedf4" shape-rendering="crispEdges">
        <rect x="1" y="0" width="1" height="1"/>
        <rect x="8" y="0" width="1" height="1"/>
        <rect x="3" y="4" width="4" height="1"/>
      </g>
    </symbol>

    <symbol id="px-gem" viewBox="0 0 10 8">
      <g fill="currentColor" shape-rendering="crispEdges">
        <rect x="4" y="0" width="2" height="1"/>
        <rect x="3" y="1" width="4" height="1"/>
        <rect x="2" y="2" width="6" height="1"/>
        <rect x="1" y="3" width="8" height="2"/>
        <rect x="2" y="5" width="6" height="1"/>
        <rect x="3" y="6" width="4" height="1"/>
        <rect x="4" y="7" width="2" height="1"/>
      </g>
      <rect x="3" y="2" width="1" height="1" fill="#efedf4" shape-rendering="crispEdges"/>
    </symbol>

    <symbol id="px-critter" viewBox="0 0 10 8">
      <g fill="currentColor" shape-rendering="crispEdges">
        <rect x="1" y="0" width="1" height="1"/>
        <rect x="8" y="0" width="1" height="1"/>
        <rect x="2" y="1" width="6" height="1"/>
        <rect x="1" y="2" width="8" height="4"/>
        <rect x="1" y="6" width="2" height="1"/>
        <rect x="7" y="6" width="2" height="1"/>
      </g>
      <g fill="#efedf4" shape-rendering="crispEdges">
        <rect x="3" y="3" width="1" height="1"/>
        <rect x="6" y="3" width="1" height="1"/>
      </g>
    </symbol>

  </defs>
</svg>

<div class="strip"></div>

<main class="page">

  <svg class="px px--robot" aria-hidden="true"><use href="#px-robot"/></svg>
  <svg class="px px--critter" aria-hidden="true"><use href="#px-critter"/></svg>
  <svg class="px px--gem" aria-hidden="true"><use href="#px-gem"/></svg>


  <p class="code rise" aria-hidden="true"><span>4</span><span>0</span><span>4</span></p>

  <h1 class="title rise">This page isn't here</h1>

  <p class="lede rise">Maybe I moved it somewhere else, or maybe the address has a typo in it. Either way, there's nothing at this one.</p>

  <a class="back rise" href="/">
    <span class="back__arrow" aria-hidden="true">&larr;</span>
    Back to the games
  </a>

</main>

</body>
</html>
